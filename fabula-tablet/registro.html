<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro HACCP</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Registro HACCP stampabile (v0.57): un modulo MOD-xx del Manuale di Autocontrollo per periodo, con l'intestazione del manuale
   (azienda, riconoscimento CE, revisione, sezione) ripetuta su ogni pagina e lo spazio per la firma del responsabile. */
:root{
  --bg:#f6f4ef; --paper:#fff; --fg:#161514; --muted:#5d6168; --rule:#d9d4c8; --accent:#1e3a5f; --warn:#b4472c; --warn-bg:#fbefeb; --gold-bg:#fbf4e3; --gold:#8a6a24;
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.3;padding:0 16px 32px}
.bar{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:3px solid var(--accent);padding:10px 0;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.bar label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.bar select,.bar input{font:.95rem var(--body);padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--fg);max-width:100%}
.bar>div{min-width:0;max-width:100%}
.bar select{width:min(520px,calc(100vw - 32px))}
.bar .chk{display:flex;align-items:center;gap:6px;font-size:.9rem;padding-bottom:6px}
.btn{border:0;border-radius:6px;padding:8px 14px;font:600 .95rem var(--body);cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:inline-block}
.btn.sec{background:var(--paper);color:var(--fg);border:1px solid var(--rule)}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;max-width:1280px;margin:0 auto;overflow-x:auto}
.hd{display:grid;grid-template-columns:1fr auto;gap:16px;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:10px}
.hd .co .name{font-family:var(--display);font-size:1.25rem;font-weight:600}
.hd .co div,.hd .man div{font-size:.88rem}
.hd .man{text-align:right}
.hd .mod{font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1}
.hd .t{font-weight:600;font-size:1rem;margin:2px 0}
.draft{color:var(--warn);font-weight:600}
.banner{border:1.5px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:6px 10px;margin-bottom:10px;font-weight:600;font-size:.9rem}
.sum{font-size:.88rem;color:var(--muted);margin:0 0 8px}
table.reg{width:100%;border-collapse:collapse;font-size:.85rem}
table.reg th,table.reg td{border:1px solid var(--rule);padding:4px 6px;text-align:left;vertical-align:top}
table.reg thead th{background:#efece4;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
table.reg thead tr.ref th{background:none;border:0;border-bottom:1px solid var(--rule);text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:.75rem;padding:0 0 4px}
table.reg tr.ko td{background:var(--warn-bg);color:var(--warn);font-weight:600}
table.reg tr.warn td{background:var(--gold-bg)}
table.reg tr.blank td{height:30px}
td.empty{color:var(--muted);font-style:italic;text-align:center;padding:14px}
.foot{margin-top:12px;font-size:.85rem}
.foot .meta{color:var(--muted)}
.foot .revs{margin:8px 0}
.sign{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:16px;margin-top:22px}
.sign div{border-top:1px solid var(--fg);padding-top:4px;font-size:.82rem;color:var(--muted)}
.small{font-size:.75rem;color:var(--muted);margin-top:10px}
.err{color:var(--warn);font-weight:600}
@media (max-width:640px){ .hd{grid-template-columns:1fr} .hd .man{text-align:left} .sign{grid-template-columns:1fr} }
@page{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff;padding:0;font-size:10.5px}
  .noprint{display:none!important}
  .sheet{border:0;padding:0;max-width:none;overflow:visible}
  table.reg{font-size:9.5px}
  table.reg thead{display:table-header-group}
  table.reg tr{break-inside:avoid}
  table.reg tr.ko td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.reg tr.warn td,table.reg thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar noprint">
  <div><label for="mod">Modulo</label><select id="mod"></select></div>
  <div><label for="from">Dal</label><input id="from" type="date"></div>
  <div><label for="to">Al</label><input id="to" type="date"></div>
  <label class="chk"><input id="blank" type="checkbox"> Modulo vuoto da compilare a mano</label>
  <button class="btn" id="go">Mostra</button>
  <button class="btn sec" id="print">Stampa</button>
  <a class="btn sec" href="haccp.html#registri">← Manuale di Autocontrollo</a>
</div>
<div class="sheet" id="sheet"><p id="msg">Caricamento…</p></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="perm.js"></script>
<script src="registro.js"></script>
</body>
</html>
