<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Caseificio Bubalina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f4ef; --paper:#fff; --fg:#161514; --muted:#5d6168; --rule:#e4e0d6;
  --accent:#1e3a5f; --accent-fg:#fff; --warn:#b4472c; --ok:#2f7a4d; --tile:#eef2f7;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.3;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--accent);color:var(--accent-fg)}
header h1{font-family:var(--display);font-size:1.35rem;margin:0;font-weight:700}
header .who{font:700 1.05rem var(--body);color:inherit;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.55);border-radius:999px;padding:9px 16px;cursor:pointer;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who.none{background:#fff;color:var(--warn);border-color:#fff}   /* v0.96 (A-01): nobody chosen → asks who is recording */
main{flex:1;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0))}
.view{display:none}.view.active{display:block}
h2{font-family:var(--display);font-size:1.6rem;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:18px;font:600 1.25rem var(--body);background:var(--accent);color:var(--accent-fg);cursor:pointer;margin-top:12px}
.btn.secondary{background:var(--paper);color:var(--fg);border:2px solid var(--rule)}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.5}
.big{font-family:var(--display);font-size:2.2rem;padding:28px}
label{display:block;font-weight:600;margin-top:14px;color:var(--muted);font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;font:1.6rem var(--body);padding:14px;border:2px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--fg);margin-top:4px}
input[type=number],input[data-num]{font-variant-numeric:tabular-nums}
/* v0.98 (audit A-13): the number as the tablet read it, under the box; red when it is not possible */
.echo{font-size:1.15rem;font-weight:600;color:var(--muted);margin-top:4px;min-height:1.2em;font-variant-numeric:tabular-nums}
.echo.bad{color:var(--warn)} input.bad{border-color:var(--warn)}
.dose-pack{margin-top:10px}.dose-pack input{font-size:1.3rem;padding:10px}
.limit{color:var(--warn);font-weight:600;margin-top:6px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.task.overdue{border-color:var(--warn)}
.task.go{border-left:4px solid var(--ok)}.task.go time{color:var(--ok)}
.hint{font-size:.9rem;color:var(--muted);margin-top:6px}
.shipcard{background:var(--tile);border:2px solid var(--accent);border-radius:10px;padding:12px 14px;margin-top:10px}
.shipcard .sc-kg{font-family:var(--display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.shipcard .sc-when{font-size:1.35rem;font-weight:600}.shipcard .sc-note{margin-top:6px;color:var(--muted)}
.shipchk-err{color:#fff;background:var(--warn);border-radius:8px;font-weight:600;margin-top:8px;padding:0 12px}.shipchk-err:not(:empty){padding:10px 12px}
.task time{font-family:var(--display);font-size:1.2rem;color:var(--muted)}
.task .code{font-size:.85rem;color:var(--muted)}
.card{background:var(--tile);border-radius:10px;padding:14px;margin-bottom:12px}
.card .scan{font-family:var(--display);font-size:1.4rem;font-weight:700}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000;min-height:280px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0));background:var(--fg);color:var(--bg);padding:14px 16px;border-radius:10px;font-weight:600;display:none;z-index:9}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--warn);color:#fff}
.check{display:flex;align-items:center;gap:12px;font-size:1.2rem;padding:12px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px}
.check input{width:28px;height:28px;margin:0}
.pending{font-size:.85rem;color:var(--muted);text-align:center;margin-top:16px}
.row{display:flex;gap:10px}.row .btn{margin-top:12px}
.dose-prog{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:6px}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin-bottom:16px}.bar>div{height:100%;background:var(--accent);transition:width .3s}
.dose-card{background:var(--paper);border:2px solid var(--rule);border-radius:14px;padding:22px;text-align:center}
.dose-name{font-family:var(--display);font-size:1.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.dose-qty{font-family:var(--display);font-size:4.2rem;font-weight:700;color:var(--accent);line-height:1.05;margin:10px 0;font-variant-numeric:tabular-nums}
.dose-instr{font-size:1.15rem}.dose-src{color:var(--warn);font-size:.85rem;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.btn.huge{font-size:1.7rem;padding:26px}
.alt-row{display:flex;align-items:center;gap:10px}.alt-row input{flex:1}.alt-row span{font:600 1.4rem var(--body);color:var(--muted)}
.notice{background:var(--paper);border:2px solid var(--warn);border-radius:10px;padding:12px 14px;margin-top:14px}
.notice .nt{font-family:var(--display);font-size:1.25rem;font-weight:700;color:var(--warn);margin-bottom:6px}
.notice.info{border-color:var(--rule)}.notice.info .nt{color:var(--muted)}
.notice.alert{border-width:3px;background:#fdecea}.notice.alert .nt::before{content:"⚠ "}   /* v0.93: food-safety alerts stand out and come first */
.notice.warn{border-color:#c98a1a}.notice.warn .nt{color:#8a5a00}
.nitem{display:block;width:100%;text-align:left;border:0;background:var(--tile);border-radius:8px;padding:12px;margin-top:6px;font:600 1.1rem var(--body);color:var(--fg);cursor:pointer}
.btn.attention{border:2px solid var(--warn);color:var(--warn);font-weight:700}
/* v0.97 (audit A-07/A-17): questions that stay until answered; red when the answer rejects milk or holds a lot */
.ask-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.ask{background:var(--paper);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;border:3px solid var(--accent)}
.ask.danger{border-color:var(--warn);background:#fdecea}
.ask-t{font-family:var(--display);font-size:1.5rem;font-weight:700;margin-bottom:8px}.ask.danger .ask-t{color:var(--warn)}
.ask-l{font-size:1.2rem;margin-top:6px}
/* v0.97 (audit A-11/A-07): refused saves and non-conformities stay on screen */
.card.rej{background:#fdecea;border:2px solid var(--warn)}.card.rej .scan{color:var(--warn)}
#rej-banner{cursor:pointer}
/* v0.97 (audit A-15): follow-ups with the time left */
#followups{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fu{display:block;width:100%;text-align:left;border:3px solid #c98a1a;background:#fff6e5;border-radius:10px;padding:12px 14px;font:inherit;color:var(--fg);cursor:pointer}
.fu.soon,.fu.late{border-color:var(--warn);background:#fdecea}
.fu-t{font-weight:700;font-size:1.15rem}.fu-m{margin-top:4px;color:var(--muted)}.fu.late .fu-m{color:var(--warn);font-weight:700}
/* v0.97 (audit A-05): «Non fatta…» on each task, earlier days apart */
.task .skip{border:1px solid var(--rule);background:var(--paper);color:var(--muted);border-radius:8px;padding:8px 10px;font:600 .85rem var(--body);margin-left:10px;cursor:pointer}
.fu .skip{display:inline-block;margin-top:8px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);border-radius:8px;padding:6px 10px;font:600 .85rem var(--body)}
.toast.info{background:var(--accent);color:#fff}
.dose-last{color:var(--ok);font-weight:600;text-align:center;margin-top:10px;min-height:1.3em}
</style>
</head>
<body>
<header><h1 data-brand="name">Caseificio Bubalina</h1><button type="button" class="who" id="who" style="display:none"></button></header>
<main>

<section class="view" id="v-login">
  <h2>Accedi</h2>
  <label for="email">Email</label><input id="email" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="btn-login">Entra</button>
</section>

<section class="view" id="v-home">
  <div id="update-banner" class="notice warn" style="display:none"><div class="nt">È disponibile una nuova versione dell'app</div><button class="nitem" onclick="location.reload()">Aggiorna ora ›</button></div>
  <div id="rej-banner" class="notice alert" style="display:none"></div>
  <div id="followups" style="display:none"></div>
  <div id="renames" class="notice warn" style="display:none"></div>
  <button class="btn big" id="btn-scan">▣ Scansiona</button>
  <div class="row"><button class="btn secondary" id="btn-receive">📦 Arrivo merce</button><button class="btn secondary" id="btn-count">📋 Conta magazzino</button><button class="btn secondary" id="btn-effl">💧 Reflui</button></div>
  <button class="btn secondary" id="btn-ship" style="width:100%;margin-top:8px">🚚 Da spedire <span id="ship-n"></span></button>
  <button class="btn secondary" id="btn-reprint" style="width:100%;margin-top:8px">🖨 Ristampa etichette lotto</button>
  <button class="btn secondary" id="btn-haccp" style="width:100%;margin-top:8px" onclick="window.__haccp && window.__haccp()">🛡 HACCP · CCP, tarature, infestanti, campioni</button>
  <div id="notice-wrap" style="display:none"></div>
  <div class="pending" id="onshift" style="text-align:left;margin-top:10px"></div>
  <div id="plan-wrap" style="display:none"><h2 style="margin-top:22px">Produzione di oggi</h2><div class="pending" id="plan-sum" style="text-align:left;margin:0 0 8px"></div><div class="tasks" id="plan"></div></div>
  <div id="selldown-wrap" style="display:none"><h2 style="margin-top:22px">Da vendere prima</h2><div class="tasks" id="selldown"></div></div>
  <h2 style="margin-top:22px">Da fare oggi</h2>
  <div class="tasks" id="tasks"></div>
  <div id="tasks-old-wrap" style="display:none"><h2 style="margin-top:22px">Non fatte nei giorni scorsi</h2><div class="pending" style="text-align:left;margin:0 0 8px">Falle adesso, oppure «Non fatta…» con il motivo: restano nel registro.</div><div class="tasks" id="tasks-old"></div></div>
  <div class="pending" id="pending"></div>
  <div class="pending" id="acct" style="margin-top:28px"></div>
  <button class="btn secondary" id="btn-logout" style="margin-top:6px">Esci</button>
</section>

<section class="view" id="v-scan">
  <div id="reader"></div>
  <label for="manual">Oppure scrivi il codice</label>
  <input id="manual" placeholder="EQ:CF-01">
  <div class="row"><button class="btn secondary" id="btn-scan-cancel">Annulla</button><button class="btn" id="btn-manual">OK</button></div>
</section>

<section class="view" id="v-form">
  <div class="card"><div class="scan" id="f-title"></div><div id="f-sub"></div></div>
  <form id="form"></form>
  <div class="row"><button class="btn secondary" id="btn-form-cancel">Annulla</button><button class="btn" id="btn-form-save">Salva</button></div>
</section>

<section class="view" id="v-dose">
  <div class="card"><div class="scan" id="d-title"></div></div>
  <div class="dose-prog"><span id="d-prog"></span></div>
  <div class="bar"><div id="d-bar"></div></div>
  <div class="dose-card">
    <div class="dose-name" id="d-name"></div>
    <div class="dose-src" id="d-mach"></div>
    <div class="dose-qty" id="d-qty"></div>
    <div class="dose-instr" id="d-instr"></div>
    <div class="dose-src" id="d-src"></div>
  </div>
  <div class="dose-pack" id="d-pack" style="display:none"><label for="d-lot">Lotto della confezione (facoltativo, se c'è)</label><input id="d-lot" type="text" autocapitalize="characters" autocomplete="off" placeholder="come stampato sulla confezione"></div>
  <div class="dose-last" id="d-last"></div>
  <button class="btn huge" id="d-ok">✓ Fatto</button>
  <button class="btn secondary" id="d-diff">Ho usato una quantità diversa</button>
  <div id="d-alt" style="display:none">
    <label for="d-alt-in" id="d-alt-l">Quantità usata</label>
    <div class="alt-row"><input id="d-alt-in" type="text" inputmode="decimal" autocomplete="off"><span id="d-alt-u"></span></div>
    <div class="echo" id="d-alt-echo"></div>
    <div class="limit" id="d-warn"></div>
    <button class="btn" id="d-alt-ok">Conferma</button>
  </div>
  <div style="text-align:center;margin-top:10px"><button class="btn secondary" id="d-skip" style="display:none">Salta questo passo</button> <button class="btn secondary" id="d-pause" style="display:none">Continua più tardi</button>
  </div>
</section>

</main>
<div class="toast" id="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="brand.js"></script>
<script src="perm.js"></script>
<script src="app.js"></script>
</body>
</html>
