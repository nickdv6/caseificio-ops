<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Perla · Spedizione</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Printable shipping document: DDT (documento di trasporto) for wholesale, packing list for online orders. One A4 sheet, lot numbers on every line. Data from fabula.v_shipment_doc + company.* settings. */
:root{ --bg:#f6f4ef; --paper:#fff; --fg:#161514; --muted:#5d6168; --rule:#e4e0d6; --accent:#1e3a5f; --warn:#b4472c; --tile:#eef2f7;
  --display:"Fraunces",Georgia,"Times New Roman",serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; }
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35;padding:16px}
.ctl{max-width:800px;margin:0 auto 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,button{font:1rem var(--body);padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--fg)}
button.p{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;cursor:pointer}
.sheet{max-width:800px;margin:0 auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:28px 32px}
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;border-bottom:3px solid var(--accent);padding-bottom:14px}
h1{font-family:var(--display);font-size:2rem;margin:0;line-height:1}.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.doc{text-align:right}.doc .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.doc .n{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.box{border:1px solid var(--rule);border-radius:6px;padding:10px 12px}.box .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}.box b{font-family:var(--display);font-size:1.2rem}.box div{font-size:.95rem}
table{width:100%;border-collapse:collapse;margin-top:6px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td code{font-family:ui-monospace,Menlo,monospace;font-size:.95em;background:var(--tile);padding:1px 5px;border-radius:3px}
tr.tot td{border-bottom:0;font-weight:600}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0;padding:12px;background:var(--tile);border-radius:6px}.terms .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.terms .v{font-weight:600}
.note{font-size:.85rem;color:var(--muted);margin-top:12px}
.sig{margin-top:30px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;font-size:.85rem;color:var(--muted)}.sig div{border-top:1px solid var(--rule);padding-top:4px}
.empty{color:var(--muted);font-style:italic}
.badge{display:inline-block;font-family:var(--display);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--accent);color:#fff;margin-left:8px;vertical-align:middle}
@media (max-width:600px){ .parties,.top,.sig{grid-template-columns:1fr} .doc{text-align:left} .sheet{padding:18px} }
@media print{ body{background:#fff;padding:0} .ctl{display:none} .sheet{border:0;border-radius:0;max-width:none;padding:0} :root{--paper:#fff;--fg:#000;--muted:#444;--rule:#bbb;--tile:#f2f2f2} }
</style>
</head>
<body>
<div class="ctl"><label for="id">Spedizione</label><input type="text" id="id" placeholder="DDT-20261002-01 o id" style="width:230px"><button class="p" id="go">Mostra</button><button id="print">Stampa / PDF</button><a href="console.html#ops" style="color:var(--muted);margin-left:auto">← console</a></div>
<div class="sheet" id="sheet"><div class="empty">Accedi dalla console o dal tablet, poi indica il numero DDT.</div></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const CFG = window.FABULA_CONFIG, sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { db: { schema: 'fabula' } });
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (n, d = 2) => n == null ? '—' : Number(n).toLocaleString('it-IT', { maximumFractionDigits: d, minimumFractionDigits: d });
  const fmtD = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '—';
  const fmtT = s => s ? new Date(s).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' }) : '—';
  async function show(ref) {
    const sheet = $('sheet');
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { sheet.innerHTML = '<div class="empty">Non sei collegato: apri prima la <a href="console.html">console</a> ed entra.</div>'; return; }
    if (!ref) { sheet.innerHTML = '<div class="empty">Indica il numero DDT (es. DDT-20261002-01).</div>'; return; }
    const { data: cs } = await sb.from('settings').select('key, value').like('key', 'company.%');
    const C = Object.fromEntries((cs || []).map(r => [r.key.slice(8), (r.value || '').trim()]));
    const q = sb.from('v_shipment_doc').select('*'); const isUuid = /^[0-9a-f-]{36}$/i.test(ref);
    const { data: d, error } = await (isUuid ? q.eq('shipment_id', ref) : q.eq('ddt_number', ref.toUpperCase())).maybeSingle();
    if (error) { sheet.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
    if (!d) { sheet.innerHTML = `<div class="empty">Spedizione ${esc(ref)} non trovata.</div>`; return; }
    const online = d.channel === 'shopify', a = d.ship_address || {};
    const lines = d.lines || []; const totKg = lines.reduce((s, l) => s + Number(l.qty), 0), ordKg = lines.reduce((s, l) => s + Number(l.ordered || 0), 0);
    const destName = d.customer || a.name || 'Cliente online';
    const destAddr = online && a.address1 ? [a.address1, a.address2, [a.zip, a.city].filter(Boolean).join(' ') + (a.provinceCode ? ' (' + a.provinceCode + ')' : '')].filter(Boolean) : [d.customer_address, [d.customer_postcode, d.customer_city].filter(Boolean).join(' ') + (d.customer_province ? ' (' + d.customer_province + ')' : '')].filter(x => x && x.trim());
    sheet.innerHTML = `
      <div class="top">
        <div><h1>${esc(C.name || 'La Perla del Cilento')}</h1><div class="sub">${esc([C.legal_name, C.address || 'Agropoli (SA)', C.piva ? 'P.IVA ' + C.piva : '', C.email, C.phone].filter(Boolean).join(' · '))}</div></div>
        <div class="doc"><div class="l">${online ? 'Packing list · ordine online' : 'Documento di trasporto'}</div><div class="n">${esc(d.ddt_number)}</div><div class="l">${fmtD(d.ship_date)}${online ? ' · ordine ' + esc(d.order_number) : ''} <span class="badge">${esc({ picked: 'preparato', in_transit: 'spedito', delivered: 'consegnato', planned: 'pianificato', returned: 'reso' }[d.status] || d.status)}</span></div></div>
      </div>
      <div class="parties">
        <div class="box"><div class="l">Destinatario</div><b>${esc(destName)}</b>${destAddr.map(x => `<div>${esc(x)}</div>`).join('')}${d.customer_piva ? `<div>P.IVA ${esc(d.customer_piva)}</div>` : ''}${(a.phone || d.customer_phone) ? `<div>${esc(a.phone || d.customer_phone)}</div>` : ''}${(d.order_email || d.customer_email) ? `<div>${esc(d.order_email || d.customer_email)}</div>` : ''}</div>
        <div class="box"><div class="l">${online ? 'Spedizione' : 'Trasporto'}</div><div>Vettore: <b>${esc(d.carrier || '—')}</b></div>${d.tracking_number ? `<div>Tracking: <b>${esc(d.tracking_number)}</b></div>` : ''}<div>Causale: vendita</div><div>Aspetto dei beni: colli refrigerati 0–4 °C</div>${d.gross_weight_kg ? `<div>Peso lordo: ${num(d.gross_weight_kg)} kg</div>` : ''}<div>Preparato il ${fmtT(d.packed_at)}${d.packed_by ? ' da ' + esc(d.packed_by) : ''}</div></div>
      </div>
      <table>
        <tr><th>#</th><th>Prodotto</th><th>Lotto</th><th>Scadenza</th>${online ? '' : '<th class="num">Ordinati</th>'}<th class="num">Quantità</th></tr>
        ${lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.name)}<br><small style="color:var(--muted)">${esc(l.sku)}</small></td><td><code>${esc(l.lot)}</code></td><td>${fmtD(l.expiry)}</td>${online ? '' : `<td class="num">${l.ordered != null ? num(l.ordered) + ' ' + esc(l.unit) : '—'}</td>`}<td class="num">${num(l.qty)} ${esc(l.unit)}${l.weighed ? ' <small style="color:var(--muted)">⚖</small>' : ''}</td></tr>`).join('')}
        <tr class="tot"><td colspan="${online ? 4 : 5}" class="num">Totale</td><td class="num">${num(totKg)} kg</td></tr>
      </table>
      <div class="terms">
        <div><div class="l">Colli</div><div class="v">${lines.length}</div></div>
        <div><div class="l">Conservazione</div><div class="v">0–4 °C · consumare entro la scadenza</div></div>
        ${online ? `<div><div class="l">Ordine</div><div class="v">${esc(d.order_number)} del ${fmtD(d.order_date)}</div></div>` : `<div><div class="l">Data e ora inizio trasporto</div><div class="v">${fmtT(d.packed_at)}</div></div>`}
        ${!online && ordKg ? `<div><div class="l">Differenza su ordinato</div><div class="v">${num(totKg - ordKg)} kg</div></div>` : ''}
      </div>
      ${online ? `<div class="note">Grazie per il tuo ordine! Mozzarella di Bufala Campana DOP prodotta ad Agropoli: tienila fuori dal frigo per 20 minuti prima di gustarla. Il lotto sopra indicato garantisce la tracciabilità fino al latte della Masseria.</div>`
               : `<div class="note">Il presente documento di trasporto è emesso ai sensi del DPR 472/1996. Fattura differita entro il 15 del mese successivo. Merce viaggia a rischio del destinatario, in regime refrigerato.</div>
      <div class="sig"><div>Firma conducente</div><div>Firma destinatario</div><div>Per ${esc(C.name || 'La Perla del Cilento')}</div></div>`}`;
    document.title = 'La Perla · ' + d.ddt_number;
  }
  const fromUrl = new URLSearchParams(location.search).get('id') || new URLSearchParams(location.search).get('ddt');
  if (fromUrl) { $('id').value = fromUrl; show(fromUrl); } else show(null);
  $('go').onclick = () => { const v = $('id').value.trim(); history.replaceState(null, '', '?id=' + encodeURIComponent(v)); show(v); };
  $('id').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
  $('print').onclick = () => print();
})();
</script>
</body>
</html>
