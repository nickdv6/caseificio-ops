# Netlify (v1.08b, 19/10/2026): the app lives on https://app.bubalina.it (GitHub Pages, published by every release). This Netlify
# site only forwards: fabula-tablet/config.js sends every page opened here to the same page on the new address (the tablet first
# sends what is waiting and carries its name and id). Netlify builds only when config.js changes, so that forwarding stays and no
# release spends Netlify credits (15 of the free plan's 300 per deploy; at zero Netlify pauses the site, as on 14/10).
# Two copies on purpose: Netlify reads this file from the site's base directory, which may be the repo root or fabula-tablet/.
# The path below starts with «:/», so it means the repo's fabula-tablet/config.js either way. Only «ignore» is set here: base,
# publish and build settings stay as they are in the Netlify dashboard.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/fabula-tablet/config.js"
