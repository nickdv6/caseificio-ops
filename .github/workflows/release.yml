# v1.08: the release pipeline (RELEASING.md). Merging into main is the release: when CI is green on main, this workflow
#   1. plan      (no Supabase secret) reads the live commit and migration history from the database (public.fabula_live_release(),
#                the publishable key), lists what changes since then, and rehearses the database part: a scratch database built
#                like the live one gets the release script in one transaction. Nothing to deploy (docs, tests, tools only) → it stops here, nobody is asked.
#                A STOP or a failed rehearsal → red, nobody is asked, and the Bot feed / Telegram say so («bloccato prima
#                dell'approvazione», through the outside watcher's report function and its backup token).
#   2. apply     waits for Nick's approval of the «live» environment (GitHub app: «Review deployments» → Approve), then reads the
#                live commit again (another release may have finished meanwhile), installs the Supabase CLI from a checked download,
#                deploys the server functions and applies the migrations (release.json says which first), publishes fabula-tablet on
#                GitHub Pages (app.bubalina.it), checks the app answers with the new version, and writes the result in the
#                database: an «ok» row is what makes this commit the live one (Bot feed «Rilasci», Telegram if it stopped).
# Secrets: SUPABASE_ACCESS_TOKEN only in the «live» environment and only on the steps that call Supabase; BACKUP_EXPORT_TOKEN only
# on the steps that report a blocked release and (v1.19) on the two that tell the database what GitHub main holds (release.py github).
# Runs only for pushes to main of this repository (never for pull requests or forks).
# Actions pinned to a commit (the repo is public). No step writes to the repository.
name: Release
run-name: "Release · ${{ github.event_name == 'workflow_run' && github.event.workflow_run.display_title || format('manual {0}', inputs.sha || 'main') }}"
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to release (empty: main as it is now)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      anything: ${{ steps.plan.outputs.anything }}
      version: ${{ steps.plan.outputs.version }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The commit, on main
        id: sha
        run: |
          sha=$(git rev-parse --verify 'HEAD^{commit}')
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # v1.19 (audit S-1 step 2): the database's hourly check no longer reads GitHub; tell it what main holds now (origin/main, not
      # the commit being planned). Never fails the plan: a report that does not arrive only ages the board's GitHub checks.
      - name: Tell the database what GitHub main holds
        continue-on-error: true
        env:
          BACKUP_EXPORT_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
        run: python3 tools/release/release.py github --ref origin/main --source release --run-url "$RUN_URL"
      - name: The live commit and migration history (from the database)
        id: live
        run: python3 tools/release/release.py live --source public --migrations-out "$RUNNER_TEMP/live-migrations.json"
      - name: What changes since the live commit
        id: plan
        env:
          LIVE: ${{ steps.live.outputs.live }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: python3 tools/release/release.py plan --sha "$SHA" --live "$LIVE" --live-migrations "$RUNNER_TEMP/live-migrations.json"
      - name: Postgres 16 for the rehearsal
        if: steps.plan.outputs.anything == 'true' && steps.plan.outputs.database == 'true'
        run: |
          if ! pg_lsclusters 2>/dev/null | grep -q '^16 '; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
          fi
          sudo pg_ctlcluster 16 main start || true
      - name: Rehearsal of the database part on a copy of the live commit
        if: steps.plan.outputs.anything == 'true' && steps.plan.outputs.database == 'true'
        env:
          LIVE: ${{ steps.live.outputs.live }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: sudo -E python3 tools/release/release.py rehearse --sha "$SHA" --live "$LIVE" --live-migrations "$RUNNER_TEMP/live-migrations.json"
      - name: Tell the Bot feed the release was blocked before the approval
        if: failure() && steps.sha.outcome == 'success'
        env:
          BACKUP_EXPORT_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: python3 tools/release/release.py blocked --stage plan --sha "$SHA" --run-url "$RUN_URL"

  apply:
    needs: plan
    if: needs.plan.outputs.anything == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45     # the database script may run 10 minutes, and a lost answer is waited for up to 15 more
    concurrency:
      group: release-apply
      cancel-in-progress: false
    environment:
      name: live
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write         # GitHub Pages
      id-token: write      # GitHub Pages
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The live commit, read again
        id: live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 tools/release/release.py live --source api
      - name: Still the newest release?
        id: check
        env:
          LIVE: ${{ steps.live.outputs.live }}
        run: python3 tools/release/release.py check --sha "$SHA" --live "$LIVE" --out "$RUNNER_TEMP/release-result.json"
      - name: Supabase CLI 2.118.0 (checked download, no secret in this step)
        if: steps.check.outputs.functions == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/supabase.tgz" https://github.com/supabase/cli/releases/download/v2.118.0/supabase_2.118.0_linux_amd64.tar.gz
          echo "f6089a86fb9d9221c958193a277338daddd6822f706929943812fa32e106c86d  $RUNNER_TEMP/supabase.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sbcli" && tar -xzf "$RUNNER_TEMP/supabase.tgz" -C "$RUNNER_TEMP/sbcli" supabase
          "$RUNNER_TEMP/sbcli/supabase" --version
          echo "SUPABASE_CLI=$RUNNER_TEMP/sbcli/supabase" >> "$GITHUB_ENV"
      - name: Server functions and database
        id: deploy
        if: steps.check.outputs.go == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LIVE: ${{ steps.live.outputs.live }}
        run: python3 tools/release/release.py deploy --sha "$SHA" --live "$LIVE" --out "$RUNNER_TEMP/release-result.json"
      - name: Package the app
        id: pack
        if: steps.deploy.outcome == 'success' && steps.deploy.outputs.site == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: fabula-tablet
      - name: Publish the app on GitHub Pages
        id: pages
        if: steps.pack.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: The app answers with the new version
        if: steps.pages.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        run: python3 tools/release/release.py site-check --url "$PAGE_URL" --out "$RUNNER_TEMP/release-site.json"
      - name: Record the result in the database (an «ok» row makes this commit the live one)
        id: record
        if: always() && (steps.check.outputs.go == 'true' || steps.check.outputs.stop == 'true')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_OUTCOME: ${{ steps.pages.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 tools/release/release.py record --sha "$SHA" --result "$RUNNER_TEMP/release-result.json"
          --site "$RUNNER_TEMP/release-site.json" --site-outcome "$SITE_OUTCOME" --job-status "$JOB_STATUS" --run-url "$RUN_URL"
      - name: Tell the Bot feed when nothing could be recorded (the token, Supabase not answering)
        if: >-
          failure() &&
          ((steps.check.outputs.go != 'true' && steps.check.outputs.stop != 'true') || steps.record.outcome == 'failure')
        env:
          BACKUP_EXPORT_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
          STAGE: ${{ steps.record.outcome == 'failure' && 'record' || 'apply' }}
        run: python3 tools/release/release.py blocked --stage "$STAGE" --sha "$SHA" --run-url "$RUN_URL"
      # v1.19: once more after the release, so the board compares the new database with what main holds (the plan job's report
      # may have gone to a database that did not know this kind of report yet, as for v1.19 itself)
      - name: Tell the database what GitHub main holds, after the release
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BACKUP_EXPORT_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
        run: python3 tools/release/release.py github --ref origin/main --source release --run-url "$RUN_URL"
